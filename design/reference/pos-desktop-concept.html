<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Desktop Concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one desktop window (graphite chrome + paper panes), scaled to fit the viewer. Single theme by design. */
:root{
 --stage:#121213;
 --chrome-900:#1f2023; --chrome-800:#2a2b2f; --chrome-700:#35373b; --chrome-600:#46484d; --chrome-line:#18191b;
 --chrome-fg:#ecebe7; --chrome-muted:#a6a7a2;
 --pane:#f2f2ef; --pane-2:#e9e9e5; --pane-head:#e2e2dd; --well:#ffffff; --line:#cdcdc7; --line-2:#e0e0db;
 --ink:#1c1d1f; --muted:#5c5e5a; --subtle:#878883;
 --accent:#f0b232; --accent-h:#dc9810; --accent-line:#c48b10; --on-accent:#141310;
 --chart:var(--chart);--flash:#fbe7b5;--sel:#dce3ed; --sel-line:#4f75aa; --focus:#2f6fd0;
 --ok:#1f7a4d; --ok-bg:#dcefe4; --warn:#9a5306; --warn-bg:#f8e7d2; --bad:#a8302a; --bad-bg:#f7dfdc; --info:#285c9e; --info-bg:#dde8f6;
 --ui:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif; --num:"IBM Plex Mono",ui-monospace,monospace;
 color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--chrome-fg);font-family:var(--ui);margin:0;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}
#win{position:absolute;left:0;top:0;width:1280px;height:820px;transform-origin:0 0;display:grid;grid-template-rows:40px 40px 1fr 24px;background:var(--chrome-800);font-size:13px;color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.5)}
#win *{box-sizing:border-box}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
kbd{font:500 10px var(--num)}
/* chrome */
.title{background:var(--chrome-900);display:flex;align-items:center;padding:0 12px;color:var(--chrome-muted);font-size:12px;border-bottom:1px solid var(--chrome-line)}
.lights{display:flex;gap:7px;width:70px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.title .t{flex:1;text-align:center;color:var(--chrome-fg)}
.tabs{background:var(--chrome-900);display:flex;align-items:flex-end;padding:0 8px;gap:2px}
.tab{height:30px;padding:0 14px;display:flex;align-items:center;gap:7px;color:var(--chrome-muted);border-radius:4px 4px 0 0;font-weight:500;position:relative}
.tab:hover{color:var(--chrome-fg)}
.tab.on{background:var(--chrome-800);color:var(--chrome-fg)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tab kbd{color:var(--chrome-muted);opacity:.7}
.tabs .sp{flex:1}
.cmd{align-self:center;width:280px;height:24px;border-radius:4px;background:var(--chrome-700);color:var(--chrome-muted);display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12px;margin-bottom:3px}
.cmd span{flex:1}
.tool{background:var(--chrome-800);display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--chrome-line);color:var(--chrome-fg)}
.tb{height:30px;padding:0 10px;display:flex;align-items:center;gap:6px;border-radius:4px;font-size:12.5px;color:var(--chrome-fg)}
.tb:hover{background:var(--chrome-700)} .tb:disabled{opacity:.4;cursor:default;background:none}
.tb svg{width:16px;height:16px}
.tb kbd{color:var(--chrome-muted)}
.sep{width:1px;height:20px;background:var(--chrome-600);margin:0 6px}
.tool .sp{flex:1}
.tool .ctx{font-size:12px;color:var(--chrome-muted);padding:0 8px}
.seg{display:flex;background:var(--chrome-900);border-radius:4px;padding:2px;gap:2px}
.seg button{padding:3px 10px;border-radius:3px;color:var(--chrome-muted);font-size:12px;font-weight:500}.seg button.on{background:var(--chrome-600);color:var(--chrome-fg)}
.status{background:var(--chrome-900);color:var(--chrome-muted);display:flex;align-items:center;font-size:11.5px;border-top:1px solid var(--chrome-line)}
.status>span{padding:0 12px;display:flex;align-items:center;gap:6px;height:100%;border-right:1px solid var(--chrome-700);white-space:nowrap}
.status .sp{flex:1;border:0}
.status b{color:var(--chrome-fg);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:#7bd389;display:inline-block}.dot.h{background:transparent;border:1.5px solid var(--chrome-muted)}
/* panes */
.main{display:grid;background:var(--line);gap:1px;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--pane)}
.ph{height:28px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--pane-head);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.ph .sp{flex:1}.ph .c{font-weight:500;font-family:var(--num)}
.ptab{height:28px;display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--line);color:var(--muted);font-weight:600;font-size:12px}
.ph.tabsh{padding-left:0}
.ptab.on{background:var(--pane);color:var(--ink);height:29px;margin-bottom:-1px}
.scroll{flex:1;overflow:auto;min-height:0;position:relative}
.well{background:var(--well)}
.btn{height:30px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--well);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--pane-2)}
.btn kbd{color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.btn.pri{background:var(--accent);border-color:var(--accent-line);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-h)}
.btn.pri kbd{color:var(--on-accent);border-color:rgba(0,0,0,.25)}
.btn.big{height:44px;font-size:15px}
.btn:disabled,.btn.pri:disabled{background:var(--pane-2);border-color:var(--line);color:var(--subtle);cursor:not-allowed}
.btn.danger{color:var(--bad)}
.btn.sm{height:26px}
.ib{width:26px;height:26px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;background:var(--well)}
.ib svg{width:15px;height:15px}
.badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:3px;font-size:11px;font-weight:600;background:var(--pane-2);color:var(--muted);white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}
.input{height:28px;border:1px solid #a9aaa4;border-radius:3px;background:var(--well);padding:0 8px;font:inherit;color:var(--ink);width:100%}
.input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 2px rgba(47,111,208,.2)}
.input.cashin{height:40px;font-size:20px}#win.touch .input.cashin{height:52px;font-size:22px}
.input.money{font-family:var(--num);text-align:right;font-weight:600}
.mut{color:var(--muted)} .sub{color:var(--subtle)} .neg{color:var(--bad)}
/* table */
table.t{color:var(--ink);font-family:var(--ui);width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;background:var(--well)}
.t th{position:sticky;top:0;background:var(--pane-2);text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);height:26px;padding:0 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);white-space:nowrap;z-index:1}
.t td{height:30px;padding:0 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.t tr:nth-child(even) td{background:#fafaf8}
.t .r{text-align:right;font-family:var(--num)}
.t tr.sel td{background:var(--sel)!important}
.t tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--sel-line)}
.t tbody tr{cursor:default}.t tbody tr:hover td{background:#eef1f5}
/* sell */
.bill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.bill .n{font-size:15px;font-weight:600;flex:1}.bill small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.ln{display:grid;grid-template-columns:30px 1fr auto;gap:0 8px;padding:6px 10px;border-bottom:1px solid var(--line-2);align-items:start;cursor:default}
.ln:hover{background:#f4f6f9}
.ln .q{font-family:var(--num);font-weight:600;text-align:right;color:var(--muted)}
.ln .a{font-family:var(--num);text-align:right;font-weight:500}
.ln .s{grid-column:2/4;font-size:11.5px;color:var(--muted)}.ln .m{color:#8a5a03;font-weight:500}
.ln.cur{background:var(--sel);box-shadow:inset 2px 0 0 var(--sel-line)}.ln.cur .q{color:var(--ink)}
.lnedit{grid-column:1/4;padding-left:38px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.lnedit .step{flex:none}.lnedit .rm{margin-left:auto;padding:0 8px}#win.touch .lnedit .rm{width:48px;padding:0}#win.touch .lnedit .step button{width:44px}#win.touch .lnedit .step output{min-width:44px}.cmd{text-align:left}
.step{display:inline-flex;border:1px solid var(--line);border-radius:3px;background:var(--well);height:26px}
.step button{width:26px;display:grid;place-items:center}.step output{min-width:32px;text-align:center;border-inline:1px solid var(--line-2);font-family:var(--num);font-weight:600;line-height:24px}
.foot{border-top:1px solid var(--line);background:var(--pane);padding:8px 10px;display:grid;gap:5px;flex:none}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--muted)}
.kv b{font-family:var(--num);font-weight:500;color:var(--ink);white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:6px;border-top:1px solid var(--line)}
.tot span{font-weight:600}.tot b{font-family:var(--num);font-size:30px;font-weight:600;letter-spacing:-.02em}
.acts{display:grid;grid-template-columns:1fr 1.6fr;gap:6px;margin-top:3px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.paybox{padding:12px 10px;display:grid;gap:10px;background:var(--well);flex:1}
.paybox .lab{font-size:12px;font-weight:600;color:var(--muted)}
.pseg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pseg button{flex:1;height:32px;border-right:1px solid var(--line);font-weight:500}
.pseg button:last-child{border:0}.pseg button.on{background:var(--chrome-800);color:var(--chrome-fg)}
.qc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qc button{height:32px;border:1px solid var(--line);border-radius:4px;font-family:var(--num);background:var(--pane)}
.qc button.on{background:var(--chrome-800);color:var(--chrome-fg);border-color:var(--chrome-800)}
.change{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-radius:4px;background:var(--pane)}
.change b{font-family:var(--num);font-size:24px}
.err{color:var(--bad);font-size:12px}
.back{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line-2)}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--well)}
.done .big{font-family:var(--num);font-size:44px;font-weight:600}
.cat{display:flex;justify-content:space-between;padding:6px 12px;width:100%;text-align:left}
.cat:hover{background:#e9ecef}
.cat .num{color:var(--subtle)}
.cat.on{background:var(--sel);box-shadow:inset 2px 0 0 var(--sel-line);font-weight:600}
.cath{font-size:11px;color:var(--subtle);padding:10px 12px 2px;font-weight:600;border-top:1px solid var(--line-2);margin-top:6px}
.search{display:flex;align-items:center;gap:8px;margin:8px 10px;height:30px;background:var(--well);border:1px solid #a9aaa4;border-radius:3px;padding:0 8px;color:var(--subtle)}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 2px rgba(47,111,208,.18)}
.search input{flex:1;border:0;outline:0;font:inherit;color:var(--ink);background:transparent}
.search kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:0 10px 10px;align-content:start}
.tile{background:var(--well);border:1px solid var(--line);border-radius:3px;min-height:78px;padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;position:relative;text-align:left}
.tile:hover{border-color:#9b9c96}
.tile:active{background:#f4f6f9}
.tile .nm{line-height:1.35;padding-right:20px}
.tile .f{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted)}
.tile .p{font-family:var(--num);font-weight:600;font-size:13px;color:var(--ink)}
.cnt{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:3px;background:var(--chrome-800);color:#fff;font:600 11px var(--num);display:grid;place-items:center;padding:0 4px}
.tile.in{border-color:var(--sel-line);box-shadow:inset 0 0 0 1px var(--sel-line)}
.tile.off{background:var(--pane-2);cursor:not-allowed}.tile.off .nm,.tile.off .p{color:var(--subtle)}
.bad{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-weight:600}
/* inspector / forms */
.insp{padding:12px;display:grid;gap:12px;align-content:start;background:var(--well)}
.fgrid{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center}
.fgrid label{font-size:12px;color:var(--muted);text-align:right}
.hint{font-size:11.5px;color:var(--subtle)}
.savebar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--pane-head)}
.savebar .msg{flex:1;font-size:12px;color:var(--warn);font-weight:600;display:flex;align-items:center;gap:6px}
.sw{width:32px;height:18px;border-radius:9px;background:var(--ok);position:relative;display:inline-block}.sw::after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.sw.off{background:#b9bab4}.sw.off::after{right:auto;left:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--well);border-bottom:1px solid var(--line)}
.kpi{padding:10px 14px;border-right:1px solid var(--line-2)}
.kpi .l{font-size:11.5px;color:var(--muted)}.kpi .v{font-family:var(--num);font-size:22px;font-weight:600;margin-top:2px}.kpi .m{font-size:11.5px;color:var(--subtle)}
.sect{font-size:11.5px;font-weight:600;color:var(--muted);padding:10px 12px 4px}
.chart text{font:11px var(--ui);fill:var(--muted)}.chart .g{stroke:var(--line-2)}
.steps{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--chrome-muted)}
.steps b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--chrome-600);font-size:10px;margin-right:4px}
.steps .d b{background:var(--chrome-fg);color:var(--chrome-900);border-color:var(--chrome-fg)}.steps .c{color:var(--chrome-fg);font-weight:600}.steps .c b{border-color:var(--chrome-fg)}
.steps i{width:16px;height:1px;background:var(--chrome-600)}
.toast{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);background:var(--chrome-900);color:var(--chrome-fg);border-radius:4px;padding:8px 8px 8px 12px;display:flex;gap:12px;align-items:center;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:20}
.toast button{color:var(--accent);font-weight:600;padding:2px 6px}
.tag{position:absolute;right:12px;top:7px;font:600 10px var(--ui);background:rgba(0,0,0,.55);color:#fff;padding:3px 6px;border-radius:3px;z-index:5}

/* ---------- touch density: same layout, bigger targets (≥44px), no shortcut hints ---------- */
#win.touch{grid-template-rows:48px 58px 1fr 32px;font-size:15px}
#win.touch kbd,#win.touch .khint{display:none}
#win.touch .tab{height:42px;padding:0 18px;font-size:15px}
#win.touch .tb{height:48px;padding:0 14px;font-size:14px;gap:8px}#win.touch .tb svg{width:20px;height:20px}
#win.touch .sep{height:30px}
#win.touch .seg button{padding:9px 16px;font-size:14px}
#win.touch .ph{height:38px;font-size:13px}#win.touch .ptab{height:38px;padding:0 18px;font-size:13px}#win.touch .ptab.on{height:39px}
#win.touch .bill{padding:10px 12px}#win.touch .bill .n{font-size:17px}
#win.touch .ib{width:44px;height:44px}#win.touch .ib svg{width:18px;height:18px}
#win.touch .ln{grid-template-columns:36px 1fr auto;padding:12px 12px}
#win.touch .ln .s{font-size:13px}
#win.touch .lnedit{margin-top:10px;gap:8px;padding-left:0}
#win.touch .step{height:44px}#win.touch .step button{width:52px}#win.touch .step output{min-width:48px;line-height:42px;font-size:16px}
#win.touch .lnedit .btn{height:44px}
#win.touch .btn{height:44px;font-size:14px;padding:0 16px}#win.touch .btn.big{height:62px;font-size:18px}
#win.touch .kv{font-size:13.5px}#win.touch .tot b{font-size:34px}
#win.touch .cat{padding:14px 14px;font-size:15px}
#win.touch .search{height:48px;margin:10px 12px;font-size:15px}
#win.touch .grid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:8px;padding:0 12px 12px}
#win.touch .tile{min-height:104px;padding:12px}#win.touch .tile .p{font-size:16px}#win.touch .tile .f{font-size:13px}
#win.touch .cnt{min-width:26px;height:26px;font-size:14px}
#win.touch .pseg button{height:52px;font-size:15px}#win.touch .qc{gap:8px}#win.touch .qc button{height:56px;font-size:16px}
#win.touch .input{height:46px;font-size:15px}
#win.touch .t{font-size:14px}#win.touch .t td{height:52px}#win.touch .t th{height:34px;font-size:12.5px}
#win.touch .back{padding:14px 12px;font-size:14px}
#win.touch .status{font-size:12.5px}
#win.touch .savebar{padding:10px 12px}
#win.touch .fgrid label{font-size:13.5px}
.dens{display:flex;height:100%}.dens button{padding:0 10px;color:var(--chrome-muted);font-size:inherit}.dens button.on{color:var(--chrome-fg);background:var(--chrome-700)}

/* ---------- shape: soft (modern) — panes float on the chrome, rounded controls, inset selections ---------- */
#win.soft{border-radius:12px}
#win.soft .main{background:var(--chrome-800);gap:6px;padding:0 6px 6px}
#win.soft .pane{border-radius:10px;overflow:hidden}
#win.soft .tool{border-bottom:0}
#win.soft .tabs{gap:4px;padding:0 10px;align-items:center}
#win.soft .tab{height:26px;border-radius:8px;padding:0 12px}
#win.soft .tab.on{background:var(--chrome-700)}
#win.soft .tab.on::before{top:auto;bottom:3px;left:12px;right:12px;height:2px;border-radius:2px}
#win.soft .cmd{border-radius:8px;margin:0}
#win.soft .tb{border-radius:8px}
#win.soft .seg{border-radius:9px;padding:3px}#win.soft .seg button{border-radius:7px}
#win.soft .ph{background:var(--pane);border-bottom:1px solid var(--line-2);color:var(--ink);font-weight:600}
#win.soft .ph.tabsh{padding:0 6px;gap:4px}
#win.soft .ptab{border:0;height:24px;border-radius:7px;padding:0 10px;margin:0;color:var(--muted)}
#win.soft .ptab.on{height:24px;margin:0;background:var(--pane-2);color:var(--ink)}
#win.soft .ln{margin:2px 6px;border-radius:8px;border-bottom:0;padding:7px 8px}
#win.soft .ln+.ln{box-shadow:0 -1px 0 var(--line-2)}
#win.soft .ln.cur{box-shadow:none;background:var(--sel)}
#win.soft .ln.cur+.ln,#win.soft .ln:hover+.ln{box-shadow:none}
#win.soft .ln:hover{border-radius:8px}
#win.soft .bill{border-bottom:0}
#win.soft .foot{border-top:1px solid var(--line-2);padding:10px}
#win.soft .btn{border-radius:8px}#win.soft .btn.big{border-radius:10px}
#win.soft .ib{border-radius:8px}
#win.soft .step{border-radius:8px;overflow:hidden}
#win.soft .input{border-radius:8px}
#win.soft .search{border-radius:10px}
