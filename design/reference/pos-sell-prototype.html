/* POS Design System — component reference styles (HTML/CSS reference, not the egui implementation).
   Reads only semantic/component tokens from tokens.css. Class prefix: ds-. State classes: is-*. */
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap");

/* ---------- density + motion (modes that tokens.json cannot express) ---------- */
:root{--fs-body:14px;--lh-body:22px;--fs-label:13px;--lh-label:20px;--fs-money:14px;--pad-row:var(--space-3);--pad-panel:var(--space-4);
  --duration-fast:120ms;--duration-base:200ms;--duration-slow:280ms;--ease-standard:cubic-bezier(.2,0,0,1)}
[data-density="touch"]{--control-sm:40px;--control-md:48px;--control-lg:56px;--control-xl:64px;--row-height:56px;--icon-md:24px;
  --fs-body:16px;--lh-body:26px;--fs-label:15px;--lh-label:22px;--fs-money:16px;--pad-row:var(--space-4)}
@media (prefers-reduced-motion:reduce){:root{--duration-fast:0ms;--duration-base:0ms;--duration-slow:0ms}}
[data-motion="reduced"]{--duration-fast:0ms;--duration-base:0ms;--duration-slow:0ms}

/* ---------- base ---------- */
.ds{font-family:var(--font-ui);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--fg-default);background:var(--bg-canvas);-webkit-font-smoothing:antialiased}

.ds :where(h1,h2,h3,h4,p,ul,ol,figure){margin:0}
.ds :where(button,input,select,textarea){font:inherit;color:inherit}
.ds-num,.ds-money{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.ds-money{white-space:nowrap;text-align:right}        /* money never wraps, never truncates */
.ds-money--neg{color:var(--danger-fg)}
.ds-muted{color:var(--fg-muted)} .ds-accent{color:var(--fg-accent)}
.ds-t-caption{font-size:12px;line-height:18px} .ds-t-label{font-size:var(--fs-label);line-height:var(--lh-label);font-weight:500}
.ds-t-title{font-size:17px;line-height:26px;font-weight:600} .ds-t-title-lg{font-size:22px;line-height:32px;font-weight:600}
.ds-t-money-xl{font-family:var(--font-num);font-size:34px;line-height:40px;font-weight:600;font-variant-numeric:tabular-nums}
.ds-t-money-lg{font-family:var(--font-num);font-size:22px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.ds-icon{width:var(--icon-md);height:var(--icon-md);flex:none;display:inline-block;vertical-align:middle}
.ds-kbd{font-family:var(--font-num);font-size:11px;line-height:16px;padding:0 5px;border-radius:var(--radius-xs);border:1px solid var(--border-default);border-bottom-width:2px;color:var(--fg-muted);background:var(--bg-surface);white-space:nowrap}
[data-density="touch"] .ds-kbd{display:none}           /* shortcut hints hide on touch; shortcuts still work */
.ds :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.ds-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- surfaces ---------- */
.ds-surface{background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-1)}
.ds-well{background:var(--bg-sunken);border-radius:var(--radius-md)}
.ds-divider{height:1px;background:var(--border-subtle);border:0}

/* ---------- button ---------- */
.ds-btn{--h:var(--control-md);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:var(--h);min-width:var(--h);padding:0 var(--space-4);
  border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-surface);color:var(--fg-default);font-size:var(--fs-label);font-weight:600;line-height:1;white-space:nowrap;cursor:pointer;
  transition:background var(--duration-fast) var(--ease-standard),border-color var(--duration-fast)}
[data-density="touch"] .ds-btn{border-radius:var(--radius-md)}
.ds-btn:hover{background:var(--bg-hover)} .ds-btn:active{background:var(--bg-pressed)}
.ds-btn--primary{background:var(--button-primary-bg);color:var(--button-primary-fg);border-color:transparent}
.ds-btn--primary:hover{background:var(--accent-bg-hover)} .ds-btn--primary:active{background:var(--accent-bg-pressed)}
.ds-btn--ghost{background:transparent;border-color:transparent}
.ds-btn--danger{background:var(--danger-solid);color:var(--fg-on-danger);border-color:transparent}
.ds-btn--danger:hover{filter:brightness(1.08)}
.ds-btn--danger-quiet{color:var(--danger-fg)}
.ds-btn--sm{--h:var(--control-sm);padding:0 var(--space-3)} .ds-btn--lg{--h:var(--control-lg);font-size:15px}
.ds-btn--xl{--h:var(--control-xl);font-size:17px;border-radius:var(--radius-md);padding:0 var(--space-5)}
.ds-btn--block{display:flex;width:100%}
.ds-btn--icon{padding:0;width:var(--h)} .ds-btn--icon.ds-btn--ghost{color:var(--fg-muted)}
.ds-btn--icon:not(.ds-btn--ghost){border-color:var(--border-control)}
.ds-btn[disabled],.ds-btn.is-disabled{opacity:var(--opacity-disabled);cursor:not-allowed;filter:none}
.ds-btn.is-loading{color:transparent;position:relative;pointer-events:none}
.ds-btn.is-loading::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-color:var(--fg-default) transparent var(--fg-default) var(--fg-default);animation:ds-spin .8s linear infinite}
.ds-btn--primary.is-loading::after{border-color:var(--fg-on-accent) transparent var(--fg-on-accent) var(--fg-on-accent)}
.ds-btn .ds-kbd{background:transparent;border-color:currentColor;color:inherit;opacity:.7}
.ds-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.ds-actions--end{justify-content:flex-end}
.ds-actions--split{justify-content:space-between}
@keyframes ds-spin{to{transform:rotate(360deg)}}

/* ---------- fields ---------- */
.ds-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.ds-label{font-size:var(--fs-label);line-height:var(--lh-label);font-weight:500;color:var(--fg-default)}
.ds-label .ds-opt{color:var(--fg-muted);font-weight:400}
.ds-help{font-size:12px;line-height:18px;color:var(--fg-muted)}
.ds-help--error{color:var(--danger-fg);display:flex;gap:6px;align-items:flex-start}
.ds-input{display:flex;align-items:center;gap:var(--space-2);height:var(--control-md);padding:0 var(--space-3);border:1px solid var(--border-control);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--fg-default);min-width:0}
[data-density="touch"] .ds-input{border-radius:var(--radius-md)}
.ds-input:focus-within{outline:2px solid var(--focus-ring);outline-offset:1px;border-color:transparent}
.ds-input input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%;font-size:var(--fs-body)}
.ds-input input::placeholder{color:var(--fg-subtle)}
.ds-input .ds-affix{color:var(--fg-muted);white-space:nowrap}
.ds-input.is-invalid{border-color:var(--danger-fg);box-shadow:inset 0 0 0 1px var(--danger-fg)}
.ds-input.is-readonly{background:var(--bg-sunken);border-style:dashed}
.ds-input--lg{height:var(--control-lg)}
.ds-input--money input{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;font-weight:600;font-size:20px}
.ds-input--money{height:var(--control-lg);border-width:2px;border-color:var(--fg-default)}
.ds-search{position:relative}
.ds-search .ds-icon{color:var(--fg-muted)}
.ds-stepper{display:inline-flex;align-items:center;border:1px solid var(--border-control);border-radius:var(--radius-sm);height:var(--control-md);overflow:hidden;background:var(--bg-surface)}
.ds-stepper button{width:var(--control-md);height:100%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg-default)}
.ds-stepper button:hover{background:var(--bg-hover)}
.ds-stepper output{min-width:44px;text-align:center;font-family:var(--font-num);font-weight:600;border-inline:1px solid var(--border-default);height:100%;display:grid;place-items:center}
[data-density="touch"] .ds-stepper{border-radius:var(--radius-md)}
.ds-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border-control);display:inline-grid;place-items:center;flex:none;background:var(--bg-surface)}
.ds-check.is-on,.ds-check.is-mixed{background:var(--fg-default);border-color:var(--fg-default);color:var(--bg-surface)}
[data-density="touch"] .ds-check{width:24px;height:24px}

.ds-switch{position:relative;display:inline-block;width:40px;height:24px;border-radius:12px;background:var(--border-control);flex:none;cursor:pointer;transition:background var(--duration-fast)}
.ds-switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--bg-surface);box-shadow:var(--shadow-1);transition:transform var(--duration-fast) var(--ease-standard)}
.ds-switch.is-on{background:var(--success-solid)} .ds-switch.is-on::after{transform:translateX(16px)}
[data-density="touch"] .ds-switch{width:52px;height:32px;border-radius:16px} [data-density="touch"] .ds-switch::after{width:26px;height:26px} [data-density="touch"] .ds-switch.is-on::after{transform:translateX(20px)}

/* ---------- select / combobox / menu ---------- */
.ds-select{cursor:pointer;justify-content:space-between}
.ds-select .ds-icon{color:var(--fg-muted)}
.ds-popover{background:var(--bg-raised);border-radius:var(--radius-md);box-shadow:var(--shadow-2);border:1px solid var(--border-default);padding:var(--space-1);min-width:220px}
.ds-menu{display:flex;flex-direction:column}
.ds-option{display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-md);padding:var(--space-1) var(--space-3);border-radius:var(--radius-sm);cursor:pointer}
.ds-option:hover,.ds-option.is-active{background:var(--bg-hover)}
.ds-option[aria-selected="true"]{font-weight:600}
.ds-option .ds-end{margin-left:auto;color:var(--fg-muted)}
.ds-option mark{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px}
.ds-menu__group{font-size:12px;color:var(--fg-muted);padding:var(--space-2) var(--space-3) var(--space-1)}
.ds-seg{display:inline-flex;padding:3px;gap:2px;background:var(--bg-sunken);border-radius:var(--radius-md)}
.ds-seg__item{height:calc(var(--control-md) - 6px);padding:0 var(--space-3);border-radius:var(--radius-sm);border:0;background:transparent;color:var(--fg-muted);font-size:var(--fs-label);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ds-seg__item.is-active{background:var(--bg-surface);color:var(--fg-default);font-weight:600;box-shadow:var(--shadow-1)}
.ds-chip{display:inline-flex;align-items:center;gap:6px;height:var(--control-sm);padding:0 var(--space-3);border-radius:var(--radius-full);border:1px solid var(--border-default);background:var(--bg-surface);font-size:var(--fs-label);white-space:nowrap;cursor:pointer}
.ds-chip.is-on{background:var(--bg-inverse);color:var(--fg-inverse);border-color:var(--bg-inverse)}
.ds-chip .ds-count{margin-left:2px}
.ds-filterbar{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}

/* ---------- navigation ---------- */
.ds-topbar{display:flex;align-items:center;gap:var(--space-2);height:52px;padding:0 var(--space-3);min-width:0}
[data-density="touch"] .ds-topbar{height:64px}
.ds-ws{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--control-md);padding:0 var(--space-3);border-radius:var(--radius-md);background:var(--bg-surface);box-shadow:var(--shadow-1);font-weight:600;border:0;cursor:pointer;white-space:nowrap}
.ds-crumb{color:var(--fg-muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-cmd{flex:1;max-width:440px;margin-inline:auto;display:flex;align-items:center;gap:var(--space-2);height:var(--control-md);padding:0 var(--space-3);border-radius:var(--radius-md);background:var(--bg-sunken);color:var(--fg-muted);font-size:14px;border:1px solid transparent;cursor:text;min-width:120px}
.ds-cmd span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 var(--space-3);border-radius:var(--radius-full);font-size:13px;background:var(--bg-surface);border:1px solid var(--border-default);white-space:nowrap}
.ds-dot{width:8px;height:8px;border-radius:50%;background:var(--fg-muted);flex:none}
.ds-dot--success{background:var(--success-solid)} .ds-dot--warning{background:var(--warning-solid)} .ds-dot--danger{background:var(--danger-solid)} .ds-dot--info{background:var(--info-solid)}
.ds-dot--hollow{background:transparent;border:2px solid var(--fg-muted)}
.ds-rail{width:var(--rail-width);display:flex;flex-direction:column;gap:2px;padding:var(--space-2) 6px;background:var(--bg-canvas)}
.ds-rail__item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--space-2) 2px;border-radius:var(--radius-md);color:var(--fg-muted);font-size:11px;line-height:14px;text-align:center;cursor:pointer;border:0;background:transparent}
.ds-rail__item:hover{background:var(--bg-hover)}
.ds-rail__item.is-active{background:var(--nav-item-active-bg);color:var(--fg-default);font-weight:600}
.ds-tabs{display:flex;gap:var(--space-1);border-bottom:1px solid var(--border-default);min-width:0;overflow:hidden}
.ds-tab{padding:0 var(--space-3);height:var(--control-md);display:inline-flex;align-items:center;gap:6px;color:var(--fg-muted);font-size:var(--fs-label);font-weight:500;border:0;background:transparent;cursor:pointer;white-space:nowrap;position:relative}
.ds-tab.is-active{color:var(--fg-default);font-weight:600}
.ds-tab.is-active::after{content:"";position:absolute;left:var(--space-2);right:var(--space-2);bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--fg-default)}

  if(st.tab==='held'){return '<section class="card">'+tabs+'<div class="lines held">'+(st.held.length?'<div class="heldnote">'+t('แตะเพื่อเปิดบิลต่อ · บิลปัจจุบันจะถูกพักแทน','Tap to resume · the current bill is held in its place')+'</div>'+st.held.map(function(h,k){return '<button class="heldrow" data-resume="'+k+'"><span class="nm">'+billLabel(h)+'</span><span class="amt">'+M(total(h))+'</span><span class="go">'+I('chevR',16)+'</span><span class="meta">'+items(h)+t(' ชิ้น · พักเมื่อ ',' items · held at ')+(h.at||'—')+'</span></button>'}).join(''):'<div class="empty-cart">'+t('ไม่มีบิลที่พักไว้','No held bills')+'</div>')+'</div></section>'}
  var lines=b.lines.length?b.lines.map(function(l,i){var p=P[l.pid];var c={th:p.th,en:p.en,q:l.q,unit:l.unit,amt:l.unit*l.q,mods:l.mods};
    var h=U.cartline(c,st.lang,i===st.sel).replace('class="ds-cartline','data-line="'+i+'" class="ds-cartline'+(i===st.flash?' flash':''));
    if(i===st.sel){h=h.replace(/<\/div>$/,'<div class="ds-cartline__edit"><div class="ds-stepper"><button data-q="-1" aria-label="−">'+I('minus',16)+'</button><output class="ds-num">'+l.q+'</output><button data-q="1" aria-label="+">'+I('plus',16)+'</button></div><span class="grow"></span><button class="ds-btn ds-btn--sm ds-btn--ghost ds-btn--danger-quiet" data-rm="'+i+'">'+I('trash',16)+t('ลบ','Remove')+' <kbd class="ds-kbd">Del</kbd></button></div></div>')}
    return h}).join(''):'<div class="empty-cart">'+I('sell',28)+'<div style="margin-top:8px;font-weight:600;color:var(--fg-default)">'+t('ตะกร้าว่าง','Cart is empty')+'</div>'+t('แตะสินค้า หรือพิมพ์ค้นหาแล้วกด Enter','Tap a product, or search and press Enter')+'</div>';
  var tot=total(),r=recvNum(),ok=tot>0&&st.recv!==''&&r>=tot;
  return '<section class="card">'+tabs+
  '<div class="bh"><div class="grow"><small>'+t('ชื่อบิล','Bill name')+'</small><b class="ds-t-title">'+billLabel(b)+'</b></div><button class="ds-btn ds-btn--icon" data-act="hold" aria-label="'+t('พักบิล','Hold')+'" title="'+t('พักบิล (F4)','Hold (F4)')+'" '+(b.lines.length?'':'disabled')+'>'+I('pause',18)+'</button><button class="ds-btn ds-btn--icon ds-btn--ghost" data-act="clear" aria-label="'+t('ล้างตะกร้า','Clear cart')+'" title="'+t('ล้างตะกร้า','Clear cart')+'" '+(b.lines.length?'':'disabled')+'>'+I('trash',18)+'</button></div>'+
  '<div class="lines" id="lines">'+lines+'</div>'+
  '<div class="foot"><div class="ds-summary"><div class="ds-kv"><span>'+t('รวมรายการ · ','Items total · ')+b.lines.length+t(' รายการ · ',' lines · ')+items()+t(' ชิ้น',' items')+'</span><span>'+M(tot)+'</span></div>'+
  '<div class="ds-kv ds-kv--total"><span>'+t('ยอดชำระ','Amount due')+'</span><span>'+M(tot,{currency:1})+'</span></div>'+
  '<div class="ds-kv"><span>'+t('รับเงินสด','Cash received')+'</span><span class="ds-input ds-input--money cash-in '+(st.err?'is-invalid':'')+'"><input id="cash" inputmode="decimal" placeholder="0.00" value="'+st.recv+'" '+(tot?'':'disabled')+'></span></div>'+
  (st.err?'<div class="ds-help ds-help--error">'+I('alert',14)+st.err+'</div>':'')+
  '<div class="ds-kv ds-kv--strong"><span>'+t('เงินทอน','Change')+'</span><span>'+(ok?M(r-tot):'—')+'</span></div></div>'+
  '<div class="qc">'+quick().map(function(v,i){return '<button class="ds-chip '+(st.recv!==''&&r===v?'is-on':'')+'" data-cash="'+v+'">'+(i===0?t('พอดี','Exact'):M(v).replace('.00',''))+'</button>'}).join('')+'</div>'+
  '<button class="ds-btn ds-btn--primary ds-btn--xl ds-btn--block" data-act="pay" '+(tot?'':'disabled')+'>'+(st.recv===''?t('รับเงิน','Take payment'):t('รับเงินสด','Take cash'))+' <span class="ds-num">'+M(tot,{currency:1})+'</span> <kbd class="ds-kbd">F9</kbd></button></div></section>'}

function viewProducts(){var q=st.q.trim().toLowerCase();
  var list=P.filter(function(p){return (st.cat==='all'||p.c===st.cat)&&(!q||p.th.toLowerCase().indexOf(q)>=0||p.en.toLowerCase().indexOf(q)>=0||p.sku.toLowerCase().indexOf(q)>=0)});
  var cats=['all','food','drink','goods','snack'].map(function(k){var n=P.filter(function(p){return k==='all'||p.c===k}).length;return '<a class="'+(st.cat===k?'is-active':'')+'" data-cat="'+k+'"><span>'+PosDS.sample.cats[k][st.lang==='th'?0:1]+'</span><span class="ds-num">'+n+'</span></a>'}).join('');
  var tiles=list.length?'<div class="ds-tiles">'+list.map(function(p){var o=Object.assign({},p,{inCart:inCart(p.id)});return U.tile(o,st.lang,t).replace('<button class="ds-tile','<button data-p="'+p.id+'" class="ds-tile')}).join('')+'</div>':
    '<div class="ds-empty"><div class="ds-empty__art">'+I('search',26)+'</div><div class="ds-empty__title">'+t('ไม่พบ “','No results for “')+st.q+'”</div><div>'+t('ลองคำอื่น หรือดูทุกหมวด','Try another word, or look in all categories')+'</div><div class="ds-actions"><button class="ds-btn ds-btn--sm" data-act="clearq">'+t('ล้างคำค้น','Clear search')+'</button></div></div>';
  return '<section class="card prod"><nav class="ds-sidenav cats">'+cats+'</nav><div class="pm"><div class="ds-input ds-input--lg">'+I('search',18)+'<input id="q" placeholder="'+t('ค้นหาชื่อ รหัส หรือสแกนบาร์โค้ด','Search name, SKU or scan barcode')+'" value="'+st.q.replace(/"/g,'&quot;')+'" autocomplete="off"><kbd class="ds-kbd">F2</kbd></div><div class="pgrid">'+tiles+'</div></div></section>'}

function viewOverlays(){var h='';
  if(st.toast)h+='<div class="toastwrap"><div class="ds-toast" role="status">'+I('check',18)+'<span style="flex:1">'+st.toast.msg+'</span>'+(st.toast.undo?'<button class="ds-btn ds-btn--sm" data-act="undo">'+t('เลิกทำ','Undo')+'</button>':'')+'</div></div>';
  if(st.sheet){var p=P[st.sheet.pid],sw=[t('ไม่หวาน','No sugar'),t('หวานน้อย','Less sweet'),t('หวานปกติ','Regular')];
    h+='<div class="ov" style="place-items:stretch"><div class="ds-scrim" data-act="closesheet"></div><div class="ds-sheet" role="dialog" aria-label="'+p[st.lang]+'"><div class="ds-sheet__head"><div class="grow"><b class="ds-t-title">'+p[st.lang]+'</b><div class="ds-muted ds-num" style="font-size:13px">'+M(p.p)+'</div></div><button class="ds-btn ds-btn--icon ds-btn--ghost" data-act="closesheet" aria-label="'+t('ปิด','Close')+'">'+I('x',18)+'</button></div>'+
    '<div class="ds-sheet__body" style="display:grid;gap:18px"><div class="ds-field"><span class="ds-label">'+t('ความหวาน','Sweetness')+'</span><div class="ds-seg">'+sw.map(function(s,i){return '<button class="ds-seg__item '+(st.sheet.sweet===i?'is-active':'')+'" data-sweet="'+i+'">'+s+'</button>'}).join('')+'</div></div>'+
    '<div class="ds-actions ds-actions--split"><span>'+t('เพิ่มไข่มุก','Add pearls')+' <span class="ds-muted ds-num">+10.00</span></span><span class="ds-switch '+(st.sheet.pearl?'is-on':'')+'" role="switch" aria-checked="'+st.sheet.pearl+'" data-act="pearl"></span></div></div>'+
    '<div class="ds-sheet__foot"><button class="ds-btn ds-btn--ghost" data-act="closesheet">'+t('ยกเลิก','Cancel')+'</button><span class="grow"></span><button class="ds-btn ds-btn--primary ds-btn--lg" data-act="addopt">'+t('เพิ่มลงบิล','Add to bill')+' · <span class="ds-num">'+M(p.p+(st.sheet.pearl?10:0))+'</span></button></div></div></div>'}
  if(st.done){h+='<div class="ov"><div class="ds-scrim"></div><div class="ds-dialog" role="dialog" aria-label="'+t('รับเงินสำเร็จ','Payment complete')+'"><div class="done"><span class="ds-badge ds-badge--success">'+I('check',12)+t('ชำระแล้ว · ','Paid · ')+st.done.label+'</span><div class="ds-muted" style="margin-top:14px">'+t('เงินทอน','Change due')+'</div><div class="big">'+M(st.done.change,{currency:1})+'</div>'+
    '<div class="ds-summary" style="margin-top:14px;text-align:left"><div class="ds-kv"><span>'+t('ยอดชำระ','Amount due')+'</span><span>'+M(st.done.total)+'</span></div><div class="ds-kv"><span>'+t('รับเงินสด','Cash received')+'</span><span>'+M(st.done.recv)+'</span></div></div></div>'+
    '<div class="ds-dialog__foot"><button class="ds-btn">'+I('printer',16)+t('พิมพ์ใบเสร็จ','Print receipt')+'</button><button class="ds-btn ds-btn--primary" data-act="newbill" id="newbill">'+t('เริ่มบิลใหม่','New bill')+' <kbd class="ds-kbd">Enter</kbd></button></div></div></div>'}
  return h}

function draw(){
  var a=document.activeElement,fid=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd;
  var stg=document.getElementById('stage'),aw=stg.clientWidth,ah=stg.clientHeight,w,h;
  if(st.size==='fit'){w=Math.max(aw,1000);h=Math.max(ah,640);}else{w=st.size==='1000'?1000:1280;h=st.size==='1000'?700:820;}
  var sc0=Math.min(1,aw/w,ah/h);root.style.transform=sc0<1?'scale('+sc0+')':'none';
  root.style.left=Math.max(0,(aw-w*sc0)/2)+'px';root.style.top=st.size==='fit'?'0px':Math.max(0,(ah-h*sc0)/2)+'px';
  var cw=w<1100?'360px':(st.density==='touch'?'420px':'392px');
  root.className='ds';root.setAttribute('data-theme',st.theme);root.setAttribute('data-density',st.density);root.setAttribute('lang',st.lang);
  var av=ACC[st.accent][st.theme];ACCV.forEach(function(n,i){if(st.accent==='saffron')root.style.removeProperty(n);else root.style.setProperty(n,av[i])});
  root.style.width=w+'px';root.style.height=h+'px';
  var sc=root.querySelector('#lines'),top=sc?sc.scrollTop:0;
  drawing=true;root.innerHTML='<div class="app" style="--cw:'+cw+'">'+U.topbar(st.lang,t,{compactShift:w<1100,offline:w>=1100})+'<div class="body">'+viewCart()+viewProducts()+'</div></div>'+viewOverlays()+'<div class="ds-demo__tag">'+t('ข้อมูลตัวอย่าง','Sample data')+'</div>';
  drawing=false;var sc2=root.querySelector('#lines');if(sc2)sc2.scrollTop=top;
  viewCtl();
  if(st.done){var nb=root.querySelector('#newbill');nb&&nb.focus()}
  else if(fid&&root.querySelector('#'+fid)){var el=root.querySelector('#'+fid);restoring=true;el.focus();restoring=false;try{el.setSelectionRange(ss,se)}catch(e){}}
}

window.addEventListener('resize',function(){draw()});document.addEventListener('fullscreenchange',function(){setTimeout(draw,50)});
ctl.addEventListener('click',function(e){if(e.target.id==='fsbtn'){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){})}catch(_){}return}var b=e.target.closest('[data-set]');if(!b)return;st[b.dataset.set]=b.dataset.val;draw()});
root.addEventListener('click',function(e){var x=e.target.closest('[data-p],[data-line],[data-q],[data-rm],[data-cat],[data-tab],[data-resume],[data-cash],[data-act],[data-sweet]');if(!x)return;var d=x.dataset;
  if(d.p!=null)tap(+d.p);
  else if(d.q!=null){qty(+d.q)}
  else if(d.rm!=null){remove(+d.rm)}
  else if(d.line!=null){st.sel=(+d.line===st.sel&&st.density==='touch')?-1:+d.line;draw()}
  else if(d.cat){st.cat=d.cat;draw()}
  else if(d.tab){st.tab=d.tab;draw()}
  else if(d.resume!=null)resume(+d.resume);
  else if(d.cash){st.recv=fmtCash(d.cash);st.err='';draw()}
  else if(d.sweet!=null){st.sheet.sweet=+d.sweet;draw()}
  else if(d.act){var a=d.act;
    if(a==='hold')hold();else if(a==='pay')pay();else if(a==='undo')doUndo();else if(a==='newbill')newBill();
    else if(a==='clear'){var s=snapshot();st.bill.lines=[];st.sel=-1;st.recv='';toast(t('ล้างตะกร้าแล้ว','Cart cleared'),s);draw()}
    else if(a==='clearq'){st.q='';draw();root.querySelector('#q').focus()}
    else if(a==='closesheet'){st.sheet=null;draw()}
    else if(a==='pearl'){st.sheet.pearl=!st.sheet.pearl;draw()}
    else if(a==='addopt'){var sh=st.sheet,mods=[];var sw=[['ไม่หวาน','No sugar'],['หวานน้อย','Less sweet'],null][sh.sweet];if(sw)mods.push({th:sw[0],en:sw[1]});if(sh.pearl)mods.push({th:'+ไข่มุก',en:'+Pearls',p:10});st.sheet=null;add(sh.pid,mods)}}
});
root.addEventListener('input',function(e){
  if(e.target.id==='q'){st.q=e.target.value;var pos=e.target.selectionStart;draw();var q=root.querySelector('#q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='cash'){var v=e.target.value.replace(/[^0-9.,]/g,'');st.recv=v;st.err='';st.bigOk=false;var pos2=e.target.selectionStart;draw();var c=root.querySelector('#cash');restoring=true;c.focus();restoring=false;try{c.setSelectionRange(pos2,pos2)}catch(_){}}
});
root.addEventListener('focusin',function(e){if(e.target.id==='cash'&&!restoring&&!drawing){e.target.select()}});
root.addEventListener('focusout',function(e){if(drawing||restoring)return;if(e.target.id==='cash'&&st.recv!==''&&!isNaN(parseFloat(st.recv))){st.recv=fmtCash(st.recv);setTimeout(draw,0)}});
document.addEventListener('keydown',function(e){
  var tgt=e.target,inQ=tgt.id==='q',inCash=tgt.id==='cash';
  if(st.done){if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();newBill();setTimeout(function(){root.querySelector('#q').focus()},0)}return}
  if(st.sheet){if(e.key==='Escape'){st.sheet=null;draw()}if(e.key==='Enter'){e.preventDefault();root.querySelector('[data-act="addopt"]').click()}return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!(inQ&&st.q)&&!inCash){e.preventDefault();doUndo();return}
  if(e.key==='F2'||(e.key==='/'&&!inQ&&!inCash)){e.preventDefault();root.querySelector('#q').focus();return}
  if(e.key==='F4'){e.preventDefault();hold();return}
  if(e.key==='F9'){e.preventDefault();pay();return}
  if(inCash&&e.key==='Enter'){e.preventDefault();if(st.recv!=='')st.recv=fmtCash(st.recv);pay();return}
  if(e.key==='Escape'){if(st.q){st.q='';draw();root.querySelector('#q').focus()}else if(inCash){tgt.blur()}return}
  if(inQ&&e.key==='Enter'){e.preventDefault();var q=st.q.trim().toLowerCase();if(!q)return;var m=P.filter(function(p){return !p.closed&&p.s!==0&&(st.cat==='all'||p.c===st.cat)&&(p.th.toLowerCase().indexOf(q)>=0||p.en.toLowerCase().indexOf(q)>=0||p.sku.toLowerCase()===q||p.sku.toLowerCase().indexOf(q)>=0)});
    if(m.length){st.q='';tap(m[0].id);var qq=root.querySelector('#q');qq&&qq.focus()}return}
  if(inCash)return;
  var n=st.bill.lines.length;if(!n)return;
  if(e.key==='ArrowUp'){e.preventDefault();st.sel=st.sel<=0?n-1:st.sel-1;draw()}
  else if(e.key==='ArrowDown'){e.preventDefault();st.sel=st.sel>=n-1?0:st.sel+1;draw()}
  else if(!inQ||!st.q){if(e.key==='+'||e.key==='='){e.preventDefault();qty(1)}else if(e.key==='-'){e.preventDefault();qty(-1)}else if(e.key==='Delete'){e.preventDefault();remove(st.sel)}}
});
// start with a realistic bill
[0,0,6,6,6,2,8].forEach(function(id){add(id)});var tea={th:'หวานน้อย',en:'Less sweet'};add(4,[tea,{th:'+ไข่มุก',en:'+Pearls',p:10}]);
st.sel=st.bill.lines.length-1;st.flash=-1;draw();
setTimeout(function(){var q=root.querySelector('#q');q&&q.focus({preventScroll:true})},50);
})();
</script>
